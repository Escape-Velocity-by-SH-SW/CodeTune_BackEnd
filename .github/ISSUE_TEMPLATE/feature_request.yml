name: 기능 요청
description: 새로운 기능이나 개선 작업을 제안합니다.
title: "[Feature] "
body:
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 이 기능이 필요한 문제나 사용자 상황을 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 원하는 동작과 처리 흐름을 구체적으로 작성해 주세요.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 작업 완료 여부를 확인할 수 있는 조건을 작성해 주세요.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 작업 영역
      options:
        - Feedback API
        - AI 피드백
        - 인증 및 보안
        - 데이터베이스
        - 인프라 및 배포
        - 개발 환경 및 문서
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 제외 범위
      description: 이번 작업에 포함하지 않을 사항이나 후속 작업을 작성해 주세요.
      placeholder: 없다면 "없음"으로 작성해 주세요.

  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 이슈, 문서, API 명세 또는 설계 자료를 작성해 주세요.

  - type: checkboxes
    id: checks
    attributes:
      label: 확인 사항
      options:
        - label: 기존 이슈에 동일하거나 유사한 요청이 없는지 확인했습니다.
          required: true

